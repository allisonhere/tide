name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      # Windows ships as a cross-compiled zip, so make sure it still builds.
      - name: Vet for Windows
        env:
          CGO_ENABLED: "0"
          GOOS: windows
        run: go vet ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          targets=(
            "linux   amd64 tide-linux-x86_64"
            "linux   arm64 tide-linux-aarch64"
            "darwin  amd64 tide-darwin-x86_64"
            "darwin  arm64 tide-darwin-aarch64"
            "windows amd64 tide-windows-x86_64"
            "windows arm64 tide-windows-aarch64"
          )
          for entry in "${targets[@]}"; do
            read -r goos goarch name <<< "$entry"
            if [ "$goos" = windows ]; then
              # Windows gets a zip holding tide.exe. The in-app updater does
              # not support Windows, so this archive is for manual installs only.
              mkdir -p "dist/$name"
              CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
                -ldflags="-s -w -X main.version=${{ steps.version.outputs.tag }}" \
                -o "dist/$name/tide.exe" \
                .
              ( cd "dist/$name" && zip -q "../$name.zip" tide.exe )
              rm -r "dist/$name"
              echo "Built dist/$name.zip"
              continue
            fi
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -ldflags="-s -w -X main.version=${{ steps.version.outputs.tag }}" \
              -o "dist/$name" \
              .
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            rm "dist/$name"
            echo "Built dist/$name.tar.gz"
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Tide ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
