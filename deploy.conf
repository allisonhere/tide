# deploy.conf — what the shared Tide release console (deploy.sh) needs to know
# about this app. deploy.sh itself is identical in every Tide repository.
#
#   APP_NAME         the name in the banner
#   BINARY_NAME      the main binary; every release asset is named after it
#   REPO             owner/name on GitHub
#   AUR_PKGNAME      the AUR package the console publishes
#   BINARIES         "name:go-package" for each binary a release carries
#   CHECKSUMS_ASSET  the checksum file the release workflow uploads
#   GO_BUILD_FLAGS   extra flags for the local compile check
#   RELEASE_NOTES    auto | changelog | generated
#   BUILD_NOTE       shown by the local build step, when there is something to say
#   APP_GLYPH, ACCENT_RGB, ACCENT2_RGB   the banner: a glyph and a gradient

APP_NAME="Tide"
BINARY_NAME="tide"
REPO="allisonhere/tide"
AUR_PKGNAME="tide-bin"
BINARIES=("tide:.")
CHECKSUMS_ASSET="checksums.txt"
GO_BUILD_FLAGS=()
RELEASE_NOTES="generated"
APP_GLYPH="≋"
ACCENT_RGB="94;196;215"
ACCENT2_RGB="137;180;250"
